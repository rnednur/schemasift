default_provider: lexical

providers:
  lexical:
    adapter: lexical
    model: lexical-v1

  hosted_jev:
    adapter: system_one
    base_url: https://api.typesafe.ai
    endpoint: /v1/systemone
    model: jev-1.13.0
    authentication:
      type: bearer
      token_env: TYPESAFE_API_KEY
    timeout_ms: 10000
    max_retries: 2
    input_cost_per_million: 0.042

  local_system_one:
    adapter: system_one
    base_url: http://127.0.0.1:8000
    endpoint: /v1/systemone
    model: local-jev
    authentication:
      type: none
    timeout_ms: 3000
    max_retries: 0

  gemini_flash_openrouter:
    adapter: openai_compatible
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3.1-flash-lite-preview
    authentication:
      type: bearer
      token_env: OPENROUTER_API_KEY
    timeout_ms: 15000
    max_retries: 2
    input_cost_per_million: 0.05
    output_cost_per_million: 0.15

  gpt_luna:
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-5.6-luna
    authentication:
      type: bearer
      token_env: OPENAI_API_KEY
    reasoning_effort: none
    timeout_ms: 15000
    max_retries: 2
    input_cost_per_million: 0.20
    output_cost_per_million: 1.20

tracing:
  enabled: true
  jsonl_path: runs/schemasift-traces.jsonl

server:
  host: 127.0.0.1
  port: 8080
