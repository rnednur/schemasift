[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schemasift"
version = "0.1.0"
description = "Fast, provider-neutral schema context selection for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "SchemaSift contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "eval-type-backport>=0.2,<1",
  "tenacity>=9,<10"
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "orjson>=3.10,<4"]
otel = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
eval = ["sqlglot>=25", "datasets>=3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "coverage>=7,<8"]
all = ["schemasift[server,otel,eval,dev]"]

[project.scripts]
schemasift = "schemasift.cli:main"
bird-context = "evals.bird.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/evals/bird/tests"]
